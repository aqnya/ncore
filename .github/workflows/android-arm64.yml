name: Build Android arm64

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      NDK_DIR: ${{ github.workspace }}/android-ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install the Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          curl -fSL --retry 3 -o ndk.zip "$url"
          rm -rf "$NDK_DIR" android-ndk-"$NDK_VERSION"
          unzip -q ndk.zip
          mv android-ndk-"$NDK_VERSION" "$NDK_DIR"
          rm -f ndk.zip

      - name: Set up Bazel
        uses: ./.github/actions/bazel

      - name: Build ncore (android arm64)
        run: |
          bazel build //:ncore \
            --config=android

      - name: Verify output
        run: |
          file bazel-bin/ncore
          readelf -h bazel-bin/ncore | grep -E "Class|Machine|Type" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ncore-android-arm64
          path: bazel-bin/ncore
          if-no-files-found: error